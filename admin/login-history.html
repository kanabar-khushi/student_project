<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | Login History</title>
<link rel="stylesheet" href="admin-style.css">
</head>
<body onload="checkAdmin(); loadLoginHistoryTable()">

<!-- ADMIN HEADER -->
<nav class="navbar">
  <h2>Admin Panel</h2>
  <div class="nav-links">
    <a href="../index.html" target="_blank">Client Home</a>
    <a href="registered-users.html">Registered Users</a>
    <a href="login-history.html">Login History</a>
    <a href="orders.html">Orders</a>
    <a href="admin.html">Products</a>
    <button onclick="adminLogout()">Logout</button>
  </div>
</nav>

<!-- LOGIN HISTORY TABLE -->
<div class="box">
  <h3>Login History</h3>
  <table id="loginTable">
    <tr><th>User</th><th>Time</th></tr>
  </table>
</div>

<script>
function loadLoginHistoryTable() {
  let logins = JSON.parse(localStorage.getItem("loginHistory")) || [];
  const table = document.getElementById("loginTable");
  table.innerHTML = "<tr><th>User</th><th>Time</th></tr>";

  logins.forEach(l => {
    table.innerHTML += `<tr>
      <td>${l.username}</td>
      <td>${l.time}</td>
    </tr>`;
  });
}
</script>

<script src="admin.js"></script>
</body>
</html>
